

services:
  # Database Service (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: uptime-monitor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_123
      POSTGRES_DB: uptime_monitor
    ports:
      - "5400:5432" # Mapped to 5400 on host to avoid local PostgreSQL conflicts
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptime_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Service (Express, Prisma, cron checks)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uptime-monitor-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres_secure_password_123@db:5432/uptime_monitor?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend Service (React, Vite development server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uptime-monitor-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules # Avoid overriding container dependencies with local empty directory
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
